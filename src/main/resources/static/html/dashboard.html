<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Expense Tracker</title>

    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<div class="dashboard-container">

    <div class="welcome-section">
        <div class="greeting">
            <h2>Welcome back 👋</h2>
            <p>Track your finances · Stay in control</p>
        </div>

        <div class="date-badge" id="currentDate"></div>
    </div>

    <div class="cards">
        <div class="card">
            <h2>Total Income</h2>
            <p id="totalIncome">₹0</p>
            <small>All time earnings</small>
        </div>

        <div class="card">
            <h2>Total Expense</h2>
            <p id="totalExpense">₹0</p>
            <small>Track your spending</small>
        </div>

        <div class="card">
            <h2>Balance</h2>
            <p id="balance">₹0</p>
            <small>Net available</small>
        </div>
    </div>

    <div class="links">
        <a href="/html/expenses.html">Expenses</a>
        <a href="/html/incomes.html">Incomes</a>
        <a href="/html/balance.html">Balance</a>
        <a href="/html/categories.html">Categories</a>
        <a href="/html/budgets.html">Budgets</a>
    </div>

</div>

<script src="/js/dashboard.js"></script>

</body>
</html>
