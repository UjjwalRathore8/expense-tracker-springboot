<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Expense Tracker</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>Expense Tracker</h1>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="work@example.com"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >

                <button type="submit">
                    Sign in →
                </button>

            </form>

            <div id="message"></div>

            <p>
                Don't have an account?
                <a href="/html/register.html">
                    Get started
                </a>
            </p>

        </div>

    </div>

    <script src="/js/login.js"></script>

</body>

</html>
