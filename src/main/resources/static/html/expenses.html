<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Finly | Expense Tracker</title>

  <link rel="stylesheet" href="/css/expenses.css">
</head>

<body>

<div class="main-container">

  <div class="hero">

    <h1>📘 Expense</h1>
  <a href="/html/dashboard.html"
           class="dashboard-btn">

            ← Dashboard

        </a>
    <!-- <div class="badge-demo">
      ⚡ Add | View | Update | Delete | Total | Count
    </div>
-->
  </div>

  <div class="stats-row">

    <div class="stat-card">

      <div class="stat-label">
        💰 TOTAL EXPENSE
      </div>

      <div class="stat-number"
           id="totalAmountDisplay">
        ₹0.00
      </div>

    </div>

    <div class="stat-card">

      <div class="stat-label">
        📋 EXPENSE COUNT
      </div>

      <div class="stat-number"
           id="expenseCountDisplay">
        0
      </div>

    </div>

  </div>

  <div class="form-card">

    <div class="form-title">
      ➕ Add new expense
    </div>

    <form id="expenseForm">

      <div class="form-grid">

        <input type="text"
               id="expenseTitle"
               placeholder="Title"
               required>

        <input type="number"
               id="expenseAmount"
               placeholder="Amount"
               step="0.01"
               required>

        <input type="date"
               id="expenseDate"
               required>

        <!-- FIXED CATEGORY SELECT -->

        <select id="expenseCategory" required>

          <option value="">
            Select Category
          </option>

          <option value="4">
            General
          </option>

          <option value="1">
            Food
          </option>

          <option value="2">
            Travel
          </option>

          <option value="3">
            Shopping
          </option>

        </select>

      </div>

      <button type="submit"
              class="btn-primary">

        + Add Expense

      </button>

    </form>

  </div>

  <div class="expense-header">

    <h2>📋 All Expenses</h2>

  </div>

  <div class="list-container"
       id="expenseListWrapper">

    <div class="empty-message">
      ✨ No expenses yet.
    </div>

  </div>

</div>

<div id="updateModal"
     class="modal-overlay">

  <div class="modal-card">

    <h3>✏️ Update Expense</h3>

    <input type="text"
           id="updateTitle"
           placeholder="Title">

    <input type="number"
           id="updateAmount"
           placeholder="Amount">

    <input type="date"
           id="updateDate">

    <select id="updateCategory">

      <option value="">
        Select Category
      </option>

      <option value="4">
        General
      </option>

      <option value="1">
        Food
      </option>

      <option value="2">
        Travel
      </option>

      <option value="3">
        Shopping
      </option>

    </select>

    <div class="modal-actions">

      <button class="btn-secondary"
              id="closeModalBtn">

        Cancel

      </button>

      <button class="btn-primary"
              id="confirmUpdateBtn">

        Save Changes

      </button>

    </div>

  </div>

</div>

<script src="/js/expenses.js"></script>

</body>
</html>
